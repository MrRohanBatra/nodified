spring:
  application:
    name: identity
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: ${IDENTITY_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${IDENTITY_DB_SCHEMA:identity}
  flyway:
    enabled: ${IDENTITY_FLYWAY_ENABLED:true}
    schemas: ${IDENTITY_DB_SCHEMA:identity}
    default-schema: ${IDENTITY_DB_SCHEMA:identity}
    create-schemas: true
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
