spring:
  datasource:
    url: ${MONITOR_DB_URL:jdbc:postgresql://localhost:5432/nodified}
    username: ${MONITOR_DB_USERNAME:nodified}
    password: ${MONITOR_DB_PASSWORD:nodified}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MONITOR_JWT_ISSUER_URI:http://localhost:8081}

server:
  port: ${MONITOR_PORT:8082}

