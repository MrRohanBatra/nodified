services:
  # ----------------------------------------------------------------------------
  # Identity Service (owns 'identity' schema)
  # ----------------------------------------------------------------------------
  identity:
    build:
      context: ..
      dockerfile: services/apps/identity/Dockerfile
    container_name: nodified-identity
    environment:
      SPRING_PROFILES_ACTIVE: local
      IDENTITY_PORT: 8081
      IDENTITY_DB_URL: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
      IDENTITY_DB_USERNAME: postgres.ziievcsvbjkgjylempre
      IDENTITY_DB_PASSWORD: TheR0hanBatra
      IDENTITY_DB_SCHEMA: identity
      IDENTITY_FLYWAY_ENABLED: true
      IDENTITY_JWT_ISSUER_URI: http://localhost:8081
    ports:
      - "8081:8081"
    networks:
      - nodified-network

  # ----------------------------------------------------------------------------
  # Monitor Service (owns 'monitor' schema)
  # ----------------------------------------------------------------------------
  monitor:
    build:
      context: ..
      dockerfile: services/apps/monitor/Dockerfile
    container_name: nodified-monitor
    environment:
      SPRING_PROFILES_ACTIVE: local
      MONITOR_PORT: 8082
      MONITOR_DB_URL: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
      MONITOR_DB_USERNAME: postgres.ziievcsvbjkgjylempre
      MONITOR_DB_PASSWORD: TheR0hanBatra
      MONITOR_DB_SCHEMA: monitor
      MONITOR_FLYWAY_ENABLED: true
      MONITOR_JWT_ISSUER_URI: http://localhost:8081
    ports:
      - "8082:8082"
    networks:
      - nodified-network

  # ----------------------------------------------------------------------------
  # Gateway Service
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ..
      dockerfile: services/apps/gateway/Dockerfile
    container_name: nodified-gateway
    environment:
      SPRING_PROFILES_ACTIVE: local
      GATEWAY_PORT: 8080
      GATEWAY_JWT_ISSUER_URI: http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      - identity
    networks:
      - nodified-network

networks:
  nodified-network:
    driver: bridge
